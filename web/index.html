<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="europages – The leading B2B marketplace for European trade">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="europages">
  <title>europages</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1a3a2a;
      overflow: hidden;
    }
    /* Loading splash */
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      background: #1a3a2a;
      flex-direction: column;
      gap: 20px;
    }
    #loading .logo {
      font-family: sans-serif;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }
    #loading .logo span { color: #fff; }
    #loading .logo em { color: #8dc63f; font-style: normal; }
    #loading .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #8dc63f;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo"><span>euro</span><em>pages</em></div>
    <div class="spinner"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('loading').remove();
      document.body.style.overflow = 'auto';
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
