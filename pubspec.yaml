name: europages
description: Europages B2B Marketplace - Flutter Web App

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Responsive layout — replaces ALL manual if/else breakpoint checks
  responsive_framework: ^1.4.0

  # Google Fonts — no font files needed
  google_fonts: ^6.2.1

  # Smooth scroll & lazy loading
  flutter_staggered_animations: ^1.1.1

  # SVG support
  flutter_svg: ^2.0.10+1

  # URL launcher
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
